    // --- Modal: Exportar Relatório em PDF ---
    function PDFReportModal({
      isOpen,
      onClose,
      filteredTransactions,
      summary,
      categoryData,
      periodLabel,
      categories,
      accounts,
      cards,
      selectedMonth
    }) {
      const [reportTitle, setReportTitle] = useState('Relatório de Controle Financeiro');
      const [includeSummary, setIncludeSummary] = useState(true);
      const [includeCategories, setIncludeCategories] = useState(true);
      const [includeTransactions, setIncludeTransactions] = useState(true);
      const [isGenerating, setIsGenerating] = useState(false);

      // Direct jsPDF generation
      const handleDownloadPDF = () => {
        setIsGenerating(true);
        setTimeout(() => {
          try {
            if (!window.jspdf || !window.jspdf.jsPDF) {
              alert('Biblioteca PDF carregando ou indisponível. Abrindo diálogo de impressão para salvar em PDF.');
              window.print();
              setIsGenerating(false);
              return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pageWidth = doc.internal.pageSize.getWidth();

            // 1. Header Banner
            doc.setFillColor(5, 150, 105); // emerald-600
            doc.rect(0, 0, pageWidth, 28, 'F');

            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.text('FinanZen · ' + (reportTitle || 'Relatório Financeiro'), 14, 12);

            doc.setFontSize(8.5);
            doc.setFont('helvetica', 'normal');
            const nowFormatted = new Date().toLocaleDateString('pt-BR') + ' às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            doc.text(`Período Filtrado: ${periodLabel}  |  Emissão: ${nowFormatted}  |  Total: ${filteredTransactions.length} lançamentos`, 14, 20);

            let currentY = 36;

            // 2. Executive Summary Box
            if (includeSummary) {
              doc.setTextColor(15, 23, 42);
              doc.setFontSize(11);
              doc.setFont('helvetica', 'bold');
              doc.text('1. Resumo Executivo do Período', 14, currentY);
              currentY += 4;

              const summaryBody = [
                ['Total de Entradas (Receitas)', formatBRL(summary.income)],
                ['Despesas em Contas Bancárias (À Vista)', formatBRL(summary.accountExpenses)],
                ['Despesas em Cartões de Crédito (Faturas)', formatBRL(summary.cardExpenses)],
                ['Total Consolidado de Saídas', formatBRL(summary.totalExpenses)],
                ['Resultado / Saldo Líquido do Período', formatBRL(summary.net)]
              ];

              doc.autoTable({
                startY: currentY,
                head: [['Indicador Financeiro', 'Valor Consolidado']],
                body: summaryBody,
                theme: 'striped',
                headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8.5 },
                styles: { fontSize: 8.5, cellPadding: 2.4 },
                columnStyles: {
                  0: { fontStyle: 'bold' },
                  1: { halign: 'right', fontStyle: 'bold' }
                },
                didParseCell: function(data) {
                  if (data.section === 'body' && data.row.index === 4) {
                    data.cell.styles.textColor = summary.net >= 0 ? [5, 150, 105] : [225, 29, 72];
                  }
                },
                margin: { left: 14, right: 14 }
              });

              currentY = doc.lastAutoTable.finalY + 8;
            }

            // 3. Category Breakdown
            if (includeCategories && categoryData.length > 0) {
              if (currentY > 230) {
                doc.addPage();
                currentY = 20;
              }

              doc.setTextColor(15, 23, 42);
              doc.setFontSize(11);
              doc.setFont('helvetica', 'bold');
              doc.text('2. Despesas por Categoria', 14, currentY);
              currentY += 4;

              const catRows = categoryData.map(c => [
                c.name,
                formatBRL(c.value),
                summary.totalExpenses > 0 ? `${((c.value / summary.totalExpenses) * 100).toFixed(1)}%` : '0%'
              ]);

              doc.autoTable({
                startY: currentY,
                head: [['Categoria', 'Total Gasto (R$)', '% da Despesa Total']],
                body: catRows,
                theme: 'striped',
                headStyles: { fillColor: [51, 65, 85], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8.5 },
                styles: { fontSize: 8, cellPadding: 2 },
                columnStyles: {
                  1: { halign: 'right' },
                  2: { halign: 'right', fontStyle: 'bold' }
                },
                margin: { left: 14, right: 14 }
              });

              currentY = doc.lastAutoTable.finalY + 8;
            }

            // 4. Transaction List
            if (includeTransactions && filteredTransactions.length > 0) {
              if (currentY > 220) {
                doc.addPage();
                currentY = 20;
              }

              doc.setTextColor(15, 23, 42);
              doc.setFontSize(11);
              doc.setFont('helvetica', 'bold');
              doc.text(`3. Extrato Analítico de Lançamentos (${filteredTransactions.length} itens)`, 14, currentY);
              currentY += 4;

              const txRows = filteredTransactions.map(t => {
                const cat = categories.find(c => c.id === t.categoryId);
                const acc = t.paymentMethod === 'account' ? accounts.find(a => a.id === t.accountId) : null;
                const card = t.paymentMethod === 'credit_card' ? cards.find(c => c.id === t.creditCardId) : null;
                const dest = card ? `Cartão: ${card.name}` : (acc ? `Conta: ${acc.name}` : '-');

                return [
                  formatDateBR(t.date),
                  t.description + (t.isInstallment ? ` (${t.installmentCurrent || 1}/${t.installmentTotal || 1})` : ''),
                  cat ? cat.name : 'Geral',
                  dest,
                  t.status === 'paid' ? 'Pago' : 'Pendente',
                  (t.type === 'income' ? '+ ' : '- ') + formatBRL(t.amount)
                ];
              });

              doc.autoTable({
                startY: currentY,
                head: [['Data', 'Descrição', 'Categoria', 'Conta / Cartão', 'Status', 'Valor']],
                body: txRows,
                theme: 'grid',
                headStyles: { fillColor: [5, 150, 105], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8 },
                styles: { fontSize: 7.5, cellPadding: 1.8 },
                columnStyles: {
                  0: { cellWidth: 20 },
                  4: { halign: 'center', cellWidth: 18 },
                  5: { halign: 'right', fontStyle: 'bold', cellWidth: 28 }
                },
                didParseCell: function(data) {
                  if (data.section === 'body' && data.column.index === 5) {
                    const text = String(data.cell.raw);
                    if (text.startsWith('+')) {
                      data.cell.styles.textColor = [5, 150, 105];
                    } else {
                      data.cell.styles.textColor = [225, 29, 72];
                    }
                  }
                },
                margin: { left: 14, right: 14 }
              });
            }

            // 5. Page Numbering & Footer
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
              doc.setPage(i);
              doc.setFontSize(7.5);
              doc.setTextColor(148, 163, 184);
              doc.text(`FinanZen PWA · Relatório Financeiro Oficial · Página ${i} de ${pageCount}`, pageWidth / 2, 290, { align: 'center' });
            }

            const safeFilename = `finanzen_relatorio_${getTodayString()}.pdf`;
            doc.save(safeFilename);
          } catch (err) {
            console.error('Erro ao gerar PDF:', err);
            alert('Não foi possível gerar diretamente o PDF. Abrindo tela de impressão nativa.');
            window.print();
          } finally {
            setIsGenerating(false);
          }
        }, 150);
      };

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white dark:bg-[#111827] rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 max-h-[90vh] flex flex-col">
            
            {/* Header */}
            <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center">
                  <Icon name="fileText" size={22} />
                </div>
                <div>
                  <h3 className="text-base font-bold text-slate-900 dark:text-white">Exportar Relatório em PDF</h3>
                  <p className="text-xs text-slate-400">Configure as opções para download ou impressão</p>
                </div>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600">
                <Icon name="x" size={18} />
              </button>
            </div>

            {/* Scrollable Content */}
            <div className="flex-1 overflow-y-auto py-4 space-y-4 text-xs sm:text-sm pr-1">
              
              {/* Title input & Period Info */}
              <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700/60 space-y-3">
                <div className="space-y-1">
                  <label className="text-[11px] font-semibold text-slate-500 uppercase">Título do Documento</label>
                  <input
                    type="text"
                    value={reportTitle}
                    onChange={(e) => setReportTitle(e.target.value)}
                    placeholder="Ex: Relatório Financeiro Mensal"
                    className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-white font-semibold"
                  />
                </div>

                <div className="flex items-center justify-between text-xs pt-1">
                  <span className="text-slate-500">Período Selecionado:</span>
                  <span className="font-bold text-slate-900 dark:text-white">{periodLabel}</span>
                </div>

                <div className="flex items-center justify-between text-xs">
                  <span className="text-slate-500">Lançamentos a exportar:</span>
                  <span className="font-bold text-emerald-600 dark:text-emerald-400 font-mono">
                    {filteredTransactions.length} itens
                  </span>
                </div>
              </div>

              {/* KPI Summary Preview */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800">
                  <span className="text-[10px] text-slate-400 uppercase font-semibold block">Entradas</span>
                  <span className="text-sm font-bold text-emerald-600 dark:text-emerald-400 mt-0.5 block truncate">
                    {formatBRL(summary.income)}
                  </span>
                </div>

                <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800">
                  <span className="text-[10px] text-slate-400 uppercase font-semibold block">Despesas</span>
                  <span className="text-sm font-bold text-rose-600 dark:text-rose-400 mt-0.5 block truncate">
                    {formatBRL(summary.totalExpenses)}
                  </span>
                </div>

                <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800">
                  <span className="text-[10px] text-slate-400 uppercase font-semibold block">Cartões</span>
                  <span className="text-sm font-bold text-amber-600 dark:text-amber-400 mt-0.5 block truncate">
                    {formatBRL(summary.cardExpenses)}
                  </span>
                </div>

                <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800">
                  <span className="text-[10px] text-slate-400 uppercase font-semibold block">Saldo Líquido</span>
                  <span className={`text-sm font-bold mt-0.5 block truncate ${summary.net >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                    {formatBRL(summary.net)}
                  </span>
                </div>
              </div>

              {/* Sections to Include Checkboxes */}
              <div className="space-y-2 pt-2">
                <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">
                  Seções do Relatório
                </span>

                <div className="space-y-2">
                  <label className="flex items-center gap-2.5 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition-colors">
                    <input
                      type="checkbox"
                      checked={includeSummary}
                      onChange={(e) => setIncludeSummary(e.target.checked)}
                      className="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-4 h-4"
                    />
                    <div>
                      <span className="font-semibold text-xs text-slate-900 dark:text-white block">Resumo Executivo</span>
                      <span className="text-[11px] text-slate-400">Totalizadores de receitas, despesas e saldo líquido</span>
                    </div>
                  </label>

                  <label className="flex items-center gap-2.5 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition-colors">
                    <input
                      type="checkbox"
                      checked={includeCategories}
                      onChange={(e) => setIncludeCategories(e.target.checked)}
                      className="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-4 h-4"
                    />
                    <div>
                      <span className="font-semibold text-xs text-slate-900 dark:text-white block">Distribuição por Categoria</span>
                      <span className="text-[11px] text-slate-400">Tabela com valores gastos e percentual de cada categoria</span>
                    </div>
                  </label>

                  <label className="flex items-center gap-2.5 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition-colors">
                    <input
                      type="checkbox"
                      checked={includeTransactions}
                      onChange={(e) => setIncludeTransactions(e.target.checked)}
                      className="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 w-4 h-4"
                    />
                    <div>
                      <span className="font-semibold text-xs text-slate-900 dark:text-white block">Extrato Analítico Completo</span>
                      <span className="text-[11px] text-slate-400">Listagem de todos os {filteredTransactions.length} lançamentos filtrados com detalhes</span>
                    </div>
                  </label>
                </div>
              </div>

            </div>

            {/* Actions Footer */}
            <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
              <button
                type="button"
                onClick={onClose}
                className="w-full sm:w-auto px-4 py-2.5 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold"
              >
                Cancelar
              </button>

              <div className="flex items-center gap-2 w-full sm:w-auto">
                <button
                  type="button"
                  onClick={handlePrint}
                  className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold transition-all"
                  title="Abrir tela de impressão do navegador"
                >
                  <Icon name="printer" size={15} />
                  <span>Imprimir</span>
                </button>

                <button
                  type="button"
                  onClick={handleDownloadPDF}
                  disabled={isGenerating}
                  className="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-bold shadow-md shadow-emerald-600/25 transition-all"
                >
                  <Icon name="download" size={15} />
                  <span>{isGenerating ? 'Gerando PDF...' : 'Baixar Arquivo PDF (.pdf)'}</span>
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // 9. MODAL: BANCO DE DADOS & NUVEM (FIREBASE FIRESTORE)
    function CloudDatabaseModal({
      isOpen,
      onClose,
      currentUser,
      dbConnected,
      syncStatus,
      lastSyncTime,
      onForceSync,
      cloudAuthEmail,
      setCloudAuthEmail,
      cloudAuthPass,
      setCloudAuthPass,
      cloudAuthMode,
      setCloudAuthMode,
      cloudAuthError,
      cloudAuthLoading,
      onLogin,
      onRegister,
      onSignOut,
      totalTxs,
      totalAccounts,
      totalCards,
      totalCategories
    }) {
      const [copiedUid, setCopiedUid] = useState(false);

      if (!isOpen) return null;

      const handleCopyUid = () => {
        if (currentUser && currentUser.uid) {
          navigator.clipboard.writeText(currentUser.uid);
          setCopiedUid(true);
          setTimeout(() => setCopiedUid(false), 2000);
        }
      };

      const formatSyncDate = (d) => {
        if (!d) return 'Nunca';
        return new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' (' + new Date(d).toLocaleDateString('pt-BR') + ')';
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white dark:bg-[#111827] rounded-3xl p-5 sm:p-6 max-w-xl w-full shadow-2xl space-y-5 border border-slate-200 dark:border-slate-800 max-h-[90vh] overflow-y-auto">
            
            {/* Header */}
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                  <Icon name="database" size={22} />
                </div>
                <div>
                  <h3 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <span>Banco de Dados & Nuvem</span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">
                      Firestore Ativo
                    </span>
                  </h3>
                  <p className="text-xs text-slate-400">Google Cloud Firestore + Sincronização em Tempo Real</p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800"
              >
                <Icon name="x" size={18} />
              </button>
            </div>

            {/* Live Status Card */}
            <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200/80 dark:border-slate-800 space-y-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="relative flex h-2.5 w-2.5">
                    {syncStatus === 'synced' && (
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    )}
                    <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${
                      syncStatus === 'synced' ? 'bg-emerald-500' : syncStatus === 'syncing' ? 'bg-blue-500' : 'bg-amber-500'
                    }`}></span>
                  </span>
                  <span className="text-xs font-bold text-slate-800 dark:text-slate-200">
                    {syncStatus === 'synced'
                      ? 'Nuvem Conectada e Sincronizada'
                      : syncStatus === 'syncing'
                      ? 'Sincronizando com o Banco...'
                      : 'Modo Offline (Dados Seguros no Aparelho)'}
                  </span>
                </div>
                <button
                  onClick={onForceSync}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700/60 text-xs font-semibold text-slate-800 dark:text-slate-200 shadow-sm transition-all"
                >
                  <Icon name="refreshCw" size={13} className={syncStatus === 'syncing' ? 'animate-spin text-emerald-500' : ''} />
                  <span>Sincronizar Agora</span>
                </button>
              </div>

              <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200/60 dark:border-slate-800/80 text-xs">
                <div>
                  <span className="text-slate-400 block text-[11px]">Projeto Firebase:</span>
                  <span className="font-mono font-semibold text-slate-700 dark:text-slate-300">gen-lang-client-0900185518</span>
                </div>
                <div>
                  <span className="text-slate-400 block text-[11px]">Última Sincronização:</span>
                  <span className="font-semibold text-slate-700 dark:text-slate-300">{formatSyncDate(lastSyncTime)}</span>
                </div>
              </div>
            </div>

            {/* Database Collections Records Count */}
            <div>
              <span className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">
                Documentos Salvos na Nuvem
              </span>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <div className="p-3 rounded-xl bg-emerald-50/50 dark:bg-emerald-950/20 border border-emerald-100 dark:border-emerald-900/40 text-center">
                  <span className="text-lg font-extrabold text-emerald-600 dark:text-emerald-400 block">{totalTxs}</span>
                  <span className="text-[11px] text-slate-500 dark:text-slate-400">Transações</span>
                </div>
                <div className="p-3 rounded-xl bg-blue-50/50 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900/40 text-center">
                  <span className="text-lg font-extrabold text-blue-600 dark:text-blue-400 block">{totalAccounts}</span>
                  <span className="text-[11px] text-slate-500 dark:text-slate-400">Contas</span>
                </div>
                <div className="p-3 rounded-xl bg-purple-50/50 dark:bg-purple-950/20 border border-purple-100 dark:border-purple-900/40 text-center">
                  <span className="text-lg font-extrabold text-purple-600 dark:text-purple-400 block">{totalCards}</span>
                  <span className="text-[11px] text-slate-500 dark:text-slate-400">Cartões</span>
                </div>
                <div className="p-3 rounded-xl bg-amber-50/50 dark:bg-amber-950/20 border border-amber-100 dark:border-amber-900/40 text-center">
                  <span className="text-lg font-extrabold text-amber-600 dark:text-amber-400 block">{totalCategories}</span>
                  <span className="text-[11px] text-slate-500 dark:text-slate-400">Categorias</span>
                </div>
              </div>
            </div>

            {/* User Session & Multi-Device Sync Section */}
            <div className="border border-slate-200 dark:border-slate-800 rounded-2xl p-4 space-y-3 bg-white dark:bg-[#111827]">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <Icon name="user" size={16} className="text-emerald-500" />
                  <span className="text-xs font-bold text-slate-900 dark:text-white">
                    {currentUser && currentUser.isAnonymous ? 'Sessão Individual Segura' : 'Conta Sincronizada'}
                  </span>
                </div>
                {currentUser && !currentUser.isAnonymous && (
                  <button
                    onClick={onSignOut}
                    className="text-xs text-rose-600 hover:underline font-semibold"
                  >
                    Sair da Conta
                  </button>
                )}
              </div>

              {currentUser && (
                <div className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/80 border border-slate-100 dark:border-slate-800/80 flex items-center justify-between gap-2">
                  <div className="truncate">
                    <span className="text-[10px] text-slate-400 block">UID do Usuário (Chave Privada Firestore):</span>
                    <span className="font-mono text-xs font-semibold text-slate-700 dark:text-slate-300 truncate block">
                      {currentUser.uid}
                    </span>
                  </div>
                  <button
                    onClick={handleCopyUid}
                    className="px-2.5 py-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-800 font-semibold text-slate-700 dark:text-slate-300 flex-shrink-0"
                  >
                    {copiedUid ? 'Copiado!' : 'Copiar'}
                  </button>
                </div>
              )}

              {/* If anonymous user: Offer Email Linking for Multi-device */}
              {currentUser && currentUser.isAnonymous && (
                <div className="pt-2 border-t border-slate-100 dark:border-slate-800/80 space-y-3">
                  <div className="bg-emerald-50/60 dark:bg-emerald-950/20 p-3 rounded-xl border border-emerald-100 dark:border-emerald-900/40">
                    <p className="text-xs text-emerald-800 dark:text-emerald-300 leading-relaxed">
                      💡 <strong>Sincronização entre Celular e Computador:</strong> Crie um e-mail e senha abaixo para acessar os mesmos dados em qualquer outro dispositivo ou navegador.
                    </p>
                  </div>

                  <div className="flex border-b border-slate-200 dark:border-slate-700 mb-2">
                    <button
                      onClick={() => { setCloudAuthMode('register'); }}
                      className={`pb-2 px-3 text-xs font-bold border-b-2 transition-all ${
                        cloudAuthMode === 'register' ? 'border-emerald-500 text-emerald-600 dark:text-emerald-400' : 'border-transparent text-slate-400'
                      }`}
                    >
                      Criar Acesso por E-mail
                    </button>
                    <button
                      onClick={() => { setCloudAuthMode('login'); }}
                      className={`pb-2 px-3 text-xs font-bold border-b-2 transition-all ${
                        cloudAuthMode === 'login' ? 'border-emerald-500 text-emerald-600 dark:text-emerald-400' : 'border-transparent text-slate-400'
                      }`}
                    >
                      Já tenho conta (Entrar)
                    </button>
                  </div>

                  {cloudAuthError && (
                    <div className="p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 text-xs border border-rose-200 dark:border-rose-800">
                      {cloudAuthError}
                    </div>
                  )}

                  <form onSubmit={cloudAuthMode === 'register' ? onRegister : onLogin} className="space-y-2.5">
                    <div>
                      <input
                        type="email"
                        required
                        value={cloudAuthEmail}
                        onChange={(e) => setCloudAuthEmail(e.target.value)}
                        placeholder="Seu e-mail (ex: voce@exemplo.com)"
                        className="w-full text-xs px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white"
                      />
                    </div>
                    <div>
                      <input
                        type="password"
                        required
                        minLength={6}
                        value={cloudAuthPass}
                        onChange={(e) => setCloudAuthPass(e.target.value)}
                        placeholder="Sua senha (mínimo 6 caracteres)"
                        className="w-full text-xs px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={cloudAuthLoading}
                      className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-bold shadow-md transition-all flex items-center justify-center gap-2"
                    >
                      <Icon name="cloud" size={15} />
                      <span>{cloudAuthLoading ? 'Processando...' : cloudAuthMode === 'register' ? 'Vincular Conta na Nuvem' : 'Entrar com Minha Conta'}</span>
                    </button>
                  </form>
                </div>
              )}
            </div>

            {/* Footer */}
            <div className="flex justify-end pt-2 border-t border-slate-100 dark:border-slate-800">
              <button
                type="button"
                onClick={onClose}
                className="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-white text-xs font-bold"
              >
                Fechar
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Render React Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
